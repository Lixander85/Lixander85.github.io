<h1>JARVIS</h1>
<p>JARVIS is a small personal tool that runs on its owner's own Windows computer. It watches a folder and uploads the videos placed in it to the owner's own YouTube channel, using the YouTube Data API.</p>
<p>It is not a public service and has no user accounts of its own.</p>
